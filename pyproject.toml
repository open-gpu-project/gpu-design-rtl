[project]
name = "gpu-design-rtl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
   "cocotb>=2.0.1",
   "pytest>=9.0.3",
   "pyvcd>=0.4.1",
   "rich>=15.0.0",
]

[dependency-groups]
dev = [
   "mypy>=2.0.0",
   "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
indent-width = 3

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = true

[[tool.mypy.overrides]]
module = "design.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
   "vcd.*"
]
ignore_missing_imports = true
